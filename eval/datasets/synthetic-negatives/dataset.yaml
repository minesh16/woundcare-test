# Generated, not downloaded: `npx tsx eval/cli.mts negatives` writes 50 procedural non-wound skin
# images (eval/src/synth.ts synthNegative: skin tones from light to dark, shading, mottling,
# freckles) to $EVAL_DATA_DIR/synthetic-negatives/images. Deterministic (seed 1000 + i). No external data.
# Purpose: the negatives false-positive rate (spec §14.2) — FUSegNet has no abstain.
id: synthetic-negatives
name: Synthetic non-wound skin (procedural, generated by the harness)
version: "1"
source_url: eval/src/synth.ts (synthNegative) via `npx tsx eval/cli.mts negatives`
access: generated
licence: Generated by the MendWise eval harness; no third-party content.
image_source: synthetic
known_training_use: []
root: synthetic-negatives
adapter: folderMasks
options:
  images: images
defaults:
  woundPresent: false
  markerPresent: false
  provenance: { woundPresent: synthetic, markerPresent: synthetic }
labelMap: {}
sample_weight: 1.0
